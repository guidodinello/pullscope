name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lint-and-format:
        name: Lint & Format Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install

            - name: Run linter
              run: pnpm lint

            - name: Run formatter check
              run: pnpm format:check

            - name: Run type check
              run: pnpm check

            - name: Run tests
              run: pnpm test

    build:
        name: Build Extension
        runs-on: ubuntu-latest
        needs: lint-and-format

        strategy:
            matrix:
                browser: [chrome, firefox]

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "24"

            - name: Setup pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install

            - name: Build for ${{ matrix.browser }}
              run: |
                  if [ "${{ matrix.browser }}" = "firefox" ]; then
                    pnpm build:firefox
                  else
                    pnpm build
                  fi

            - name: Upload build artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: extension-${{ matrix.browser }}
                  path: .output/${{ matrix.browser == 'firefox' && 'firefox-mv2' || 'chrome-mv3' }}
                  retention-days: 7

    # Audits the workflow files with zizmor (dev-standards templates/ci/python-ci.yml).
    # It is in the `CI` job's needs:, so a finding blocks the merge. The version is
    # pinned so a new upstream audit cannot turn this red between runs; Dependabot
    # does not bump a `uvx` pin, so bump it by hand. GH_TOKEN is the read-only
    # workflow token; it enables the online audits that check each pinned SHA
    # really belongs to the tagged repo.
    audit-workflows:
        name: Audit workflows
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

            - name: zizmor
              env:
                  GH_TOKEN: ${{ github.token }}
              run: uvx zizmor@1.31.1 --format=github .github/workflows

    # Single stable check name for the branch ruleset (see dev-standards
    # templates/ci/python-ci.yml). if: always() so it still runs (and fails) when a
    # needed job fails; a skipped required check would count as passing.
    ci:
        name: CI
        needs:
            - lint-and-format
            - build
            - audit-workflows
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check results
              env:
                  RESULTS: ${{ join(needs.*.result, ' ') }}
              run: |
                  read -ra results <<< "$RESULTS"
                  for r in "${results[@]}"; do
                    if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
                      echo "A required job finished as: $r"
                      exit 1
                    fi
                  done
